[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "house_prices"
version = "0.1.0"
description = "House sale-price regression with fold-fitted preprocessing and holdout evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2", "matplotlib>=3.7,<4", "scipy>=1.10,<2", "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.6,<5", "xgboost>=3.1.3,<4", "catboost>=1.2.8,<2"]
selection = ["Boruta>=0.4,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
